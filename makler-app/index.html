<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImmoAssist – KI-Assistent für Makler</title>
  <meta name="description" content="KI-gestützter Assistent für Immobilienmakler: Kundenkommunikation, Termine, Kalender und Analysen in einer App." />
  <meta name="theme-color" content="#0b3b39" />
  <script>
    /* Theme früh setzen, um Aufblitzen zu vermeiden */
    try { var t = localStorage.getItem('makler-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <noscript>Bitte aktivieren Sie JavaScript, um ImmoAssist zu verwenden.</noscript>

  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
