<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00b8a9" />
  <title>Straßenheld — Fahrzeug-Ausweichspiel</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div class="stage">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div class="hud">
      <div class="score" id="score">0</div>
      <div class="best">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.8 6.1 20l1.3-6.6L2.5 8.9l6.6-.8L12 2z"
                fill="#ffb703" stroke="#f0a500" stroke-width="1" stroke-linejoin="round"/>
        </svg>
        <span id="bestVal">0</span>
      </div>
    </div>

    <!-- Startbildschirm -->
    <div class="overlay" id="start">
      <div class="card">
        <div class="tag">air up · Arcade</div>
        <h1>Straßenheld</h1>
        <p>Bring die Flasche über die Straße. Weiche Autos, LKW, Bussen und Zügen aus — je weiter du kommst, desto schneller wird's.</p>
        <button class="btn" id="startBtn">Los geht's</button>
      </div>
      <div class="hint">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span>· am Handy: wischen oder tippen</span>
      </div>
    </div>

    <!-- Game Over -->
    <div class="overlay hidden" id="over">
      <div class="card">
        <div class="tag">Erwischt!</div>
        <h1>Game Over</h1>
        <div class="stat-row">
          <div class="stat"><div class="n" id="finalScore">0</div><div class="l">Distanz</div></div>
          <div class="stat brand"><div class="n" id="finalBest">0</div><div class="l">Bestwert</div></div>
        </div>
        <button class="btn" id="againBtn">Nochmal</button>
      </div>
    </div>

    <!-- Mobile Steuerkreuz -->
    <div class="dpad" aria-hidden="true">
      <button class="up" data-dir="up">↑</button>
      <button class="left" data-dir="left">←</button>
      <button class="down" data-dir="down">↓</button>
      <button class="right" data-dir="right">→</button>
    </div>

    <div class="credit">Straßenheld</div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
